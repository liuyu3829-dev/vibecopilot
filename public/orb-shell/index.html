<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thought Space Orb</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent !important; }
    body { font-family:"Microsoft YaHei UI","Noto Sans SC",sans-serif; user-select:none; }
    button { font:inherit; }
    #shell { width:100%; height:100%; background:transparent; }
    #orb { width:92px; height:92px; padding:0; border:0; border-radius:50%; background:transparent; cursor:grab; touch-action:none; }
    #orb:active { cursor:grabbing; }
    #orb img { width:82px; height:82px; display:block; object-fit:contain; pointer-events:none; filter:drop-shadow(0 8px 15px rgba(255,164,98,.38)); animation:float 3s ease-in-out infinite; }
    #card { position:relative; display:none; width:100%; height:100%; box-sizing:border-box; padding:14px; border:1px solid rgba(255,238,227,.46); border-radius:20px; background:rgba(76,57,49,.92); box-shadow:0 16px 42px rgba(35,22,16,.34); color:#fff8f2; }
    #shell.expanded #orb { display:none; }
    #shell.expanded #card { display:flex; flex-direction:column; gap:9px; }
    .summary { display:flex; align-items:center; gap:9px; min-height:50px; }
    .summary img { width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(255,182,126,.42)); }
    .summary p { margin:0; color:rgba(255,248,242,.82); font-size:12px; line-height:1.5; }
    #record-button { display:flex; align-items:center; justify-content:center; gap:8px; min-height:39px; border:0; border-radius:11px; color:#4b3022; background:linear-gradient(125deg,#ffe3cf,#efa56e); font-weight:700; cursor:pointer; }
    #record-button.recording { color:#fff7f1; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.28); }
    #transcript { flex:1; min-height:75px; width:100%; box-sizing:border-box; resize:none; border:1px solid rgba(255,255,255,.2); border-radius:11px; padding:9px; color:#fffdfa; background:rgba(255,255,255,.09); outline:none; font:14px/1.55 "Noto Serif SC","Microsoft YaHei",serif; }
    #transcript::placeholder { color:rgba(255,250,245,.6); }
    .actions { display:flex; justify-content:center; gap:7px; flex-wrap:nowrap; }
    .actions button { box-sizing:border-box; min-height:31px; padding:0 11px; border:1px solid rgba(255,255,255,.25); border-radius:8px; color:#fffaf5; background:rgba(255,255,255,.09); cursor:pointer; white-space:nowrap; }
    .actions #save { border:0; color:#4b3022; background:linear-gradient(125deg,#ffe0c7,#eea26d); }
    #close { position:absolute; top:10px; right:10px; display:grid; width:26px; height:26px; place-items:center; border:0; border-radius:50%; color:rgba(255,239,226,.9); background:rgba(255,244,235,.08); cursor:pointer; }
    #notice { min-height:16px; margin:0; color:#ffe2cf; font-size:11px; line-height:1.35; }
    @keyframes float { 50% { transform:translateY(-3px) scale(1.02); } }

    /* Selected listening-sheet direction: visual changes only; capture controls stay intact. */
    #card { padding:17px 20px 15px; border:1px solid rgba(255,226,205,.38); border-radius:24px; background:linear-gradient(142deg,rgba(112,84,69,.92),rgba(58,43,37,.95)); box-shadow:0 18px 46px rgba(27,17,13,.42),inset 0 1px rgba(255,238,225,.15); }
    #shell.expanded #card { gap:0; }
    .summary { order:1; flex-direction:column; justify-content:center; gap:5px; min-height:66px; padding:0; text-align:center; }
    .summary img { width:54px; height:54px; filter:drop-shadow(0 5px 13px rgba(255,177,115,.56)); }
    .summary p { max-width:230px; color:rgba(255,237,222,.8); font-size:13px; line-height:1.4; }
    #transcript { order:2; flex:1; min-height:56px; padding:7px 12px; border:0; border-radius:0; background:transparent; color:#ffe9d9; text-align:center; font:16px/1.55 "Noto Serif SC","Microsoft YaHei",serif; }
    #transcript::placeholder { color:rgba(255,229,211,.62); }
    #record-button { align-self:center; box-sizing:border-box; width:128px; min-width:128px; min-height:32px; margin:0; padding:0 12px; border-radius:999px; box-shadow:0 8px 18px rgba(28,16,11,.2),inset 0 1px rgba(255,255,255,.6); font-size:13px; white-space:nowrap; }
    #record-button.recording { box-shadow:0 0 0 4px rgba(255,180,119,.14),0 8px 18px rgba(28,16,11,.24); }
    .actions { order:5; align-items:center; justify-content:center; gap:9px; }
    .actions button { min-height:29px; padding:0 10px; border:0; border-radius:9px; background:transparent; color:rgba(255,234,220,.62); font-size:12px; }
    .actions #save { width:104px; min-width:104px; padding:0; color:#4b3022; background:rgba(255,225,202,.9); box-shadow:0 6px 14px rgba(28,16,11,.18); }
    .actions #discard { display:grid; width:30px; min-width:30px; padding:0; place-items:center; border:1px solid rgba(255,224,205,.3); border-radius:50%; color:rgba(255,230,215,.82); }
    .actions #discard.armed { width:auto; min-width:62px; padding:0 10px; border-radius:999px; color:#fff0e6; background:rgba(170,90,72,.45); }
    #notice { order:6; min-height:0; margin-top:4px; text-align:center; }
  
/* Refined listening sheet: keep capture behavior intact while tightening the visual hierarchy. */
.summary { min-height:66px; padding-top:0; }
.summary img { width:66px; height:66px; }
.summary p { font-size:12px; }
#transcript { min-height:42px; max-height:58px; flex:1; overflow-y:auto; font-size:14px; line-height:1.55; }
#voice-wave { order:3; display:block; width:100%; height:20px; margin:0 auto 2px; opacity:.9; }
#notice { order:6; }
#record-button.start { color:#4b3022; background:linear-gradient(125deg,#ffe3cf,#efa56e); }
#record-button.start svg, #discard svg { width:17px; height:17px; }
#record-button.resume { width:104px; min-width:104px; padding:0; border:1px solid rgba(255,226,205,.34); color:#fff1e8; background:rgba(255,239,227,.1); }
</style>
</head>
<body>
  <main id="shell">
    <button id="orb" aria-label="打开桌面悬浮球"><img src="../assets/thought-space-orb-v3.png" alt=""></button>
    <section id="card" aria-label="桌面录音">
      <button id="close" type="button" aria-label="收起录音面板">×</button>
      <div class="summary"><img src="../assets/thought-space-orb-v3.png" alt=""><p id="hint">点击开始说话，即可实时记录你的想法。</p></div>
      <textarea id="transcript" placeholder="开始说话，或直接输入…" aria-label="实时转写文本"></textarea>
      <canvas id="voice-wave" width="270" height="24" aria-hidden="true"></canvas>
      <div class="actions"><button class="start" id="record-button" type="button" aria-label="开始说话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"></path></svg><span>开始说话</span></button><button id="save" type="button" hidden>保存</button><button id="discard" type="button" aria-label="删除本次未保存记录" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-3h4l1 3M6 7l1 13h10l1-13"></path></svg></button></div>
      <p id="notice" role="status"></p>
    </section>
  </main>
  <script>
    const shell = document.getElementById("shell");
    const orb = document.getElementById("orb");
    const card = document.getElementById("card");
    const recordButton = document.getElementById("record-button");
    const transcript = document.getElementById("transcript");
    const notice = document.getElementById("notice");
    const hint = document.getElementById("hint");
    const saveButton = document.getElementById("save");
    const discardButton = document.getElementById("discard");
    const voiceWave = document.getElementById("voice-wave");
    const waveContext = voiceWave ? voiceWave.getContext("2d") : null;
    const invoke = (name, args) => {
      const call = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
      if (!call) return Promise.reject(new Error("桌面桥接未加载"));
      return call(name, args);
    };
    let pointer = null;
    let recording = false;
    let stream = null;
    let context = null;
    let source = null;
    let processor = null;
    let socket = null;
    let confirmed = "";
    let live = "";
    let captureRun = 0;
    let discardArmed = false;
    let desktopToken = null;

    async function desktopApi(path, options = {}) {
      const response = await invoke("desktop_api_request", {
        path,
        method: options.method || "GET",
        body: options.body || null,
        authorization: desktopToken,
      });
      let data = null;
      try { data = JSON.parse(response.body); } catch {}
      return { ok: response.status >= 200 && response.status < 300, status: response.status, data };
    }
    async function refreshDesktopSession() {
      const ticket = await invoke("take_launch_ticket").catch(() => null);
      if (ticket) {
        const response = await desktopApi("/api/desktop/pair/exchange", { method:"POST", body:JSON.stringify({ticket}) });
        const result = response.data;
        if (!response.ok || !result?.data?.token) { setNotice(result?.error?.message || "桌面配对已失效，请回到网页重新打开桌面球。"); return false; }
        desktopToken = `Bearer ${result.data.token}`;
        await invoke("store_token", {token:result.data.token});
      }
      if (!desktopToken) {
        const stored = await invoke("read_token").catch(() => null);
        if (stored) desktopToken = `Bearer ${stored}`;
      }
      return Boolean(desktopToken);
    }

    async function ensureDesktopSession() {
      await refreshDesktopSession();
      try {
        const response = await desktopApi("/api/thoughts");
        if (response.ok) return true;
        const result = response.data;
        if (response.status === 401) {
          desktopToken = null;
          await invoke("clear_token").catch(() => null);
          setNotice("Desktop connection expired. Return to Thought Space and choose Show desktop orb.");
          return false;
        }
        setNotice(result?.error?.message || "Unable to connect to Thought Space. Please try again.");
      } catch (error) {
        setNotice(error instanceof Error ? error.message : "无法连接 Thought Space，请检查网络或稍后重试。");
      }
      return false;
    }

    function setNotice(value) { notice.textContent = value || ""; }
    function renderCaptureControls() {
      recordButton.disabled = false;
      if (recording) {
        recordButton.className = "recording";
        recordButton.setAttribute("aria-label", "停止录音");
        recordButton.innerHTML = '<span aria-hidden="true">■</span><span>停止</span>';
        saveButton.hidden = true;
        discardButton.hidden = true;
        return;
      }
      if (transcript.value.trim()) {
        recordButton.className = "resume";
        recordButton.setAttribute("aria-label", "继续说话");
        recordButton.textContent = "继续说话";
        saveButton.hidden = false;
        discardButton.hidden = false;
        discardButton.classList.toggle("armed", discardArmed);
        if (!discardArmed) discardButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-3h4l1 3M6 7l1 13h10l1-13"></path></svg>';
        else discardButton.textContent = "确认删除";
      } else {
        discardArmed = false;
        recordButton.className = "start";
        recordButton.setAttribute("aria-label", "开始说话");
        recordButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"></path></svg><span>开始说话</span>';
        saveButton.hidden = true;
        discardButton.hidden = true;
      }
    }
    function drawWave(samples) {
      if (!waveContext || !voiceWave) return;
      const width = voiceWave.width;
      const height = voiceWave.height;
      const points = 34;
      const step = Math.max(1, Math.floor(samples.length / points));
      waveContext.clearRect(0, 0, width, height);
      waveContext.fillStyle = "rgba(255, 190, 143, 0.82)";
      for (let i = 0; i < points; i += 1) {
        let total = 0;
        for (let j = 0; j < step; j += 1) total += Math.abs(samples[i * step + j] || 0);
        const amplitude = Math.min(height * 0.42, 2 + (total / step) * height * 7);
        const x = (i + 0.5) * (width / points);
        waveContext.fillRect(x - 1, height / 2 - amplitude, 2, amplitude * 2);
      }
    }

    function resetTranscript() {
      confirmed = ""; live = ""; transcript.value = "";
      discardArmed = false;
      renderCaptureControls();
    }
    function clearWave() {
      if (waveContext && voiceWave) waveContext.clearRect(0, 0, voiceWave.width, voiceWave.height);
    }
    function pcm16(samples, rate) {
      const ratio = rate / 16000;
      const output = new Int16Array(Math.ceil(samples.length / ratio));
      for (let i = 0; i < output.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, samples[Math.floor(i * ratio)] || 0));
        output[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return output.buffer;
    }
    function stop() {
      captureRun += 1;
      if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
      if (source) { source.disconnect(); source = null; }
      if (socket) { if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({type:"Terminate"})); socket.close(); socket = null; }
      if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
      if (context && context.state !== "closed") context.close();
      clearWave();
      context = null; recording = false;
      hint.textContent = transcript.value.trim() ? "继续说话以追加内容，或保存当前记录。" : "点击开始说话，即可实时记录你的想法。";
      renderCaptureControls();
    }
    function addTurn(message, activeRun) {
      if (captureRun !== activeRun) return;
      try {
        const turn = JSON.parse(message.data);
        if (turn.type !== "Turn" || !turn.transcript) return;
        if (/[Ѐ-ӿ]/.test(turn.transcript)) return;
        if (turn.end_of_turn) {
          const value = turn.transcript.trim();
          if (value && !confirmed.replace(/[\s,.!?，。！？]/g,"").endsWith(value.replace(/[\s,.!?，。！？]/g,""))) {
            confirmed += value + (/[。！？!?…]$/.test(value) ? "" : "。");
          }
          live = "";
        } else live = turn.transcript;
        transcript.value = confirmed + live;
      } catch {}
    }
    async function start(initialTranscript = "") {
      stop();
      const activeRun = captureRun;
      confirmed = initialTranscript; live = ""; transcript.value = initialTranscript;
      discardArmed = false;
      recordButton.disabled = true;
      saveButton.hidden = true;
      recordButton.textContent = "正在连接…";
      setNotice("正在请求麦克风…");
      try {
        const media = await navigator.mediaDevices.getUserMedia({audio:true});
        if (captureRun !== activeRun) { media.getTracks().forEach(track => track.stop()); return; }
        stream = media;
        if (!await ensureDesktopSession()) { media.getTracks().forEach(track => track.stop()); stream = null; return; }
        if (captureRun !== activeRun) { media.getTracks().forEach(track => track.stop()); return; }
        const response = await desktopApi("/api/speech/session?language=cn");
        const session = response.data;
        if (captureRun !== activeRun) { media.getTracks().forEach(track => track.stop()); return; }
        if (!response.ok || !session?.data?.url) throw new Error(session?.error?.message || "实时转写不可用");
        const audioContext = new AudioContext();
        context = audioContext;
        const webSocket = new WebSocket(session.data.url);
        socket = webSocket;
        webSocket.onmessage = event => addTurn(event, activeRun);
        webSocket.onerror = () => setNotice("实时转写连接失败，请重试。");
        webSocket.onopen = () => {
          if (captureRun !== activeRun) { webSocket.close(); media.getTracks().forEach(track => track.stop()); void audioContext.close(); return; }
          source = audioContext.createMediaStreamSource(media);
          processor = audioContext.createScriptProcessor(4096,1,1);
          processor.onaudioprocess = event => {
            const samples = event.inputBuffer.getChannelData(0);
            drawWave(samples);
            if (socket === webSocket && webSocket.readyState === WebSocket.OPEN) webSocket.send(pcm16(samples, audioContext.sampleRate));
          };
          source.connect(processor); processor.connect(context.destination);
          recording = true; setNotice(""); hint.textContent = "你的话会实时显示在下方。";
          renderCaptureControls();
        };
      } catch {
        stop(); setNotice("无法访问麦克风或启动实时转写，请检查麦克风权限。");
      }
    }
    async function open() {
      try {
        await invoke("resize_orb", {expanded:true});
        shell.classList.add("expanded");
        transcript.focus();
      } catch { setNotice("桌面窗口无法展开。"); }
    }
    async function collapse() {
      stop(); resetTranscript(); shell.classList.remove("expanded"); setNotice("");
      await invoke("resize_orb", {expanded:false});
    }
    orb.addEventListener("pointerdown", event => { pointer = {x:event.screenX,y:event.screenY,dragged:false}; orb.setPointerCapture && orb.setPointerCapture(event.pointerId); });
    orb.addEventListener("pointermove", event => {
      if (!pointer || pointer.dragged) return;
      if (Math.abs(event.screenX-pointer.x) > 3 || Math.abs(event.screenY-pointer.y) > 3) {
        pointer.dragged = true; invoke("begin_drag").catch(() => setNotice("拖动暂不可用。"));
      }
    });
    orb.addEventListener("pointerup", () => { const dragged = pointer && pointer.dragged; pointer = null; if (!dragged) open(); });
    orb.addEventListener("pointercancel", () => { pointer = null; });
    void refreshDesktopSession();
    recordButton.addEventListener("click", () => recording ? stop() : start(transcript.value));
    document.getElementById("close").addEventListener("click", collapse);
    transcript.addEventListener("input", () => {
      confirmed = transcript.value;
      live = "";
      discardArmed = false;
      if (recording) {
        stop();
        setNotice("已保留你的修改。点击开始说话后继续录音。");
      }
      renderCaptureControls();
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") void collapse(); });
    saveButton.addEventListener("click", async () => {
      const value = transcript.value.trim();
      if (!value) { setNotice("请先说一句或输入内容。"); return; }
      try {
        if (!await ensureDesktopSession()) return;
        const response = await desktopApi("/api/thoughts", {method:"POST",body:JSON.stringify({transcript:value,language:"cn",source:"desktop_orb"})});
        const result = response.data;
        if (!response.ok) throw new Error(result?.error?.message || "Save failed. Please try again.");
        stop(); resetTranscript(); setNotice("已保存到 Thought Space"); setTimeout(collapse,800);
      } catch (error) { setNotice(error instanceof Error ? error.message : "保存失败，请稍后重试。"); }
    });
    discardButton.addEventListener("click", () => {
      if (!discardArmed) {
        discardArmed = true;
        setNotice("再次点击确认删除本次未保存记录。");
        renderCaptureControls();
        return;
      }
      stop();
      resetTranscript();
      setNotice("已删除本次未保存记录。");
    });
  </script>
</body>
</html>
